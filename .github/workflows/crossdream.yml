# Сборка CrossDream («Карта снов») на машинах GitHub — все платформы: Windows (установщик NSIS), Android (apk),
# Linux (AppImage + deb), macOS (dmg, universal) и iOS. Репозиторий открытый — минуты GitHub бесплатны.
# Дома то же собирают CrossDream\tools\build-windows.ps1, build-android.ps1, build-linux.sh (WSL).
# Запуск: сам по себе при изменениях в CrossDream/**, или вручную — вкладка Actions → CrossDream → Run workflow
# (там можно выбрать одну платформу).
# Android подписывается своим ключом из секретов ANDROID_KEYSTORE_B64 и ANDROID_KEYSTORE_PROPS_B64
# (кладёт их CrossDream\tools\android-secrets.ps1) — иначе apk не встанет поверх прежнего.
# iOS без учётной записи разработчика Apple собирается только для симулятора; с секретом APPLE_DEVELOPMENT_TEAM
# (ID команды) — и для iPhone/iPad.

name: CrossDream
on:
  push:
    paths:
      - 'CrossDream/**'
      - '.github/workflows/crossdream.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Что собрать'
        type: choice
        options: [all, windows, android, linux, macos, ios]
        default: all

defaults:
  run:
    working-directory: CrossDream

jobs:
  windows:
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CrossDream

      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Сборка установщика
        working-directory: CrossDream/app
        run: cargo tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: CrossDream-windows
          path: CrossDream/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  android:
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CrossDream

      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Ключ подписи из секретов
        env:
          JKS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PROPS: ${{ secrets.ANDROID_KEYSTORE_PROPS_B64 }}
        run: |
          if [ -z "$JKS" ] || [ -z "$PROPS" ]; then
            echo "::error::Нет ключа подписи Android в секретах — запустите CrossDream/tools/android-secrets.ps1"; exit 1
          fi
          mkdir -p android-keystore
          echo "$JKS" | base64 -d > android-keystore/crossdream.jks
          echo "$PROPS" | base64 -d > android-keystore/keystore.properties

      - name: Сборка apk (arm64 для телефонов + x86_64 для эмулятора)
        working-directory: CrossDream/app
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          chmod +x gen/android/gradlew
          cargo tauri android build --apk --target aarch64 --target x86_64

      - name: Имя apk
        run: |
          APK=$(ls app/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          cp "$APK" CrossDream.apk
          rm -f android-keystore/*

      - uses: actions/upload-artifact@v4
        with:
          name: CrossDream-android
          path: CrossDream/CrossDream.apk
          if-no-files-found: error

  linux:
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Пакеты WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev             libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CrossDream

      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Сборка AppImage и deb
        working-directory: CrossDream/app
        run: cargo tauri build --bundles appimage,deb

      - uses: actions/upload-artifact@v4
        with:
          name: CrossDream-linux
          path: |
            CrossDream/target/release/bundle/appimage/*.AppImage
            CrossDream/target/release/bundle/deb/*.deb
          if-no-files-found: error

  macos:
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CrossDream

      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Сборка dmg (Intel + Apple Silicon)
        working-directory: CrossDream/app
        run: cargo tauri build --target universal-apple-darwin --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: CrossDream-macos
          path: CrossDream/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  ios:
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-latest
    env:
      # не APPLE_DEVELOPMENT_TEAM напрямую: пустую переменную Tauri считает заданной и отказывается
      # («development-team is empty»). Её выставляем только там, где ID команды действительно есть.
      TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CrossDream

      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Проект Xcode
        working-directory: CrossDream/app
        run: |
          if [ -n "$TEAM_ID" ]; then export APPLE_DEVELOPMENT_TEAM="$TEAM_ID"; fi
          cargo tauri ios init --ci

      - name: Сборка для симулятора
        if: env.TEAM_ID == ''
        working-directory: CrossDream/app
        run: cargo tauri ios build --target aarch64-sim --ci

      - name: Сборка для iPhone и iPad
        if: env.TEAM_ID != ''
        working-directory: CrossDream/app
        run: APPLE_DEVELOPMENT_TEAM="$TEAM_ID" cargo tauri ios build --target aarch64 --ci

      # Без учётной записи разработчика: .ipa для iPhone/iPad без подписи. Его подписывает своим
      # обычным (бесплатным) Apple ID программа Sideloadly или AltStore прямо при установке.
      - name: iPhone и iPad без подписи (.ipa для Sideloadly / AltStore)
        if: env.TEAM_ID == ''
        working-directory: CrossDream/app
        run: |
          PROJ=$(ls -d gen/apple/*.xcodeproj | head -1)
          SCHEME=$(xcodebuild -list -project "$PROJ" | sed -n '/Schemes:/,$p' | grep -m1 '_iOS' | xargs)
          echo "проект: $PROJ, схема: $SCHEME"
          # подпись выключена во всех настройках сборки
          sed -i '' 's/buildSettings = {/buildSettings = { CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO; CODE_SIGN_IDENTITY = ""; /' "$PROJ/project.pbxproj"
          cargo tauri ios build --target aarch64 --ci || echo "tauri не довёл до .ipa — берём .app напрямую"
          APP=$(find gen/apple/build -type d -name '*.app' -path '*iphoneos*' 2>/dev/null | head -1)
          [ -z "$APP" ] && APP=$(find gen/apple/build -type d -name '*.app' -path '*.xcarchive*' 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration release -sdk iphoneos \
              -destination 'generic/platform=iOS' -derivedDataPath build-unsigned CODE_SIGNING_ALLOWED=NO build
            APP=$(find build-unsigned -type d -name '*.app' -path '*iphoneos*' | head -1)
          fi
          echo "программа: $APP"
          test -n "$APP"
          rm -rf ipa && mkdir -p ipa/Payload && cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../CrossDream-unsigned.ipa Payload)
          ls -la CrossDream-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CrossDream-ios
          path: |
            CrossDream/app/CrossDream-unsigned.ipa
            CrossDream/app/gen/apple/build/**/*.ipa
            CrossDream/app/gen/apple/build/arm64-sim/*.app
          if-no-files-found: warn
