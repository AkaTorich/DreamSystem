[package]
name = "dream-core"
version.workspace = true
edition.workspace = true
description = "Ядро «Карты снов»: данные, хранилище, шифр, клиент сайта, синхронизация"

[lib]
name = "dream_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "multipart", "stream"] }
futures-util = "0.3"
aes-gcm = "0.10"
aes = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
